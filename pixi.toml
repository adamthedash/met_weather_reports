[workspace]
channels = ["conda-forge"]
name = "met_weather"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.0,<3.15"

[pypi-dependencies]
marimo = ">=0.25.1,<0.26"
pydantic-ai-slim = { version = "*", extras = ["openai"]}
ty = ">=0.0.90,<0.0.91"


numpy = ">=2.0,<3"
pillow = ">=11,<14"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"
pyarrow = ">=25.0.0,<26"
sentencepiece = ">=0.2.1,<0.3"
transformers = ">=5.20.2,<6"
fastapi = ">=0.115,<1"
uvicorn = ">=0.34,<1"
pyyaml = ">=6.0,<7"
requests = ">=2.32,<3"
paddleocr = ">=3.7.0,<4"
onnxruntime = "*"
opencv-python = ">=5,<6"
polars = { version = ">=2.0.0,<3", extras = ["pandas"]}


torch = { version = ">=2.14,<3", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.29.2,<3", index = "https://download.pytorch.org/whl/cpu" }
ultralytics = ">=8.4.192, <9"
scipy = ">=1.18.1, <2"


