[workspace]
channels = ["conda-forge"]
name = "met_weather"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.0,<3.15"
marimo = ">=0.25.1,<0.26"
ty = ">=0.0.90,<0.0.91"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"
pyarrow = ">=25.0.0,<26"
sentencepiece = ">=0.2.1,<0.3"
transformers = ">=5.20.2,<6"


[pypi-dependencies]
paddleocr = "*"
onnxruntime = "*"
polars = { version = ">=2.0.0,<3", extras = ["pandas"]}


torch = { version = ">=2.14,<3", index = "https://download.pytorch.org/whl/cpu" }
ultralytics = ">=8.4.192, <9"


