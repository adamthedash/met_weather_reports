<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>review — handwritten digits</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1f2229;
    --edge: #2e323b;
    --text: #e6e6e6;
    --dim: #9aa0ab;
    --accent: #4d9de0;
    --error: #e06c5a;
    --ok: #6cc08a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--edge);
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row strong { font-size: 14px; }
  #filename { color: var(--dim); font-family: ui-monospace, monospace; }
  .spacer { flex: 1; }
  button {
    background: #2a2e37;
    color: var(--text);
    border: 1px solid var(--edge);
    border-radius: 5px;
    padding: 4px 9px;
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #343945; }
  button:disabled { opacity: 0.45; cursor: default; }
  #btn-accept { border-color: var(--ok); color: var(--ok); }
  #btn-reject { border-color: var(--error); color: var(--error); }
  kbd {
    background: #2a2e37;
    border: 1px solid var(--edge);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 5px;
    font: 11px ui-monospace, monospace;
    color: var(--dim);
  }
  #status { color: var(--dim); }
  #status.error { color: var(--error); }
  #status.ok { color: var(--ok); }
  main { flex: 1; display: flex; min-height: 0; }
  #canvas-wrap {
    flex: 1;
    overflow: auto;
    padding: 18px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    background:
      repeating-conic-gradient(#191b20 0% 25%, #16181d 0% 50%) 0 / 24px 24px;
  }
  canvas {
    image-rendering: pixelated;
    box-shadow: 0 4px 24px rgba(0,0,0,0.55);
  }
  aside {
    width: 270px;
    border-left: 1px solid var(--edge);
    background: var(--panel);
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  aside h3 {
    margin: 6px 0 2px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
  }
  #boxlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  #boxlist li {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 3px 7px;
    border-radius: 5px;
  }
  #boxlist .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  #boxlist small { color: var(--dim); margin-left: auto; font-family: ui-monospace, monospace; }
  #help { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; color: var(--dim); }
  #help li { display: flex; gap: 8px; }
  #help kbd { flex: none; min-width: 58px; text-align: center; }
  #empty-note { color: var(--dim); font-style: italic; }
</style>
</head>

<body>

<header>
  <div class="row">
    <strong>review</strong>
    <span id="filename">…</span>
    <span class="spacer"></span>
    <span id="progress">reviewed 0 · remaining 0</span>
  </div>
  <div class="row">
    <button id="btn-prev">← prev</button>
    <button id="btn-next">next →</button>
    <button id="btn-reject">reject <kbd>n</kbd></button>
    <button id="btn-accept">accept <kbd>y</kbd></button>
    <span class="spacer"></span>
    <span id="status"></span>
  </div>
</header>

<main>
  <div id="canvas-wrap"><canvas id="cv"></canvas></div>
  <aside>
    <h3>prediction</h3>
    <ul id="boxlist"></ul>
    <div id="empty-note"></div>
    <h3>keys</h3>
    <ul id="help">
      <li><kbd>y</kbd><span>accept: write label, drop prediction</span></li>
      <li><kbd>n</kbd><span>reject: discard prediction</span></li>
      <li><kbd>← →</kbd><span>prev / next (no decision)</span></li>
    </ul>
  </aside>
</main>

<script>
"use strict";

/** Shorthand for document.getElementById. */
const $ = (id) => document.getElementById(id);

/**
 * Review state shared by the UI functions below. `items` is the queue of
 * undecided prediction files ({path, boxes, empty, error}); `boxes` holds the
 * prediction on display in the server's normalised 0-1 coordinates.
 */
const state = {
  classes: [],
  items: [],        // queue entries: {path, boxes, empty, error}
  index: 0,
  reviewed: 0,
  skipped: 0,       // stale prediction files the queue ignores
  img: null,
  boxes: [],        // {cls, cx, cy, w, h, conf} normalised to 0-1
  loadSeq: 0,
  loading: false,   // a display load is in flight
  busy: false,      // a decision request is in flight
};

// ---------------------------------------------------------------- colours

/** Deterministic colour for a class index. */
function classColor(cls, alpha = 1) {
  const h = Math.round((cls * 137.508) % 360);
  return `hsla(${h}, 65%, 52%, ${alpha})`;
}

// ---------------------------------------------------------------- data io

/** fetch() as JSON; throws the server's error message on non-OK responses. */
async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  // Error responses may be plain text or empty, so a failed parse there only
  // costs us the nicer message and is swallowed; on OK responses a parse
  // failure is a real bug and must surface.
  const body = await res.json().catch((err) => {
    if (res.ok) throw err;
    return {};
  });
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

/** Load an image URL into an HTMLImageElement, as a promise. */
function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("failed to load image"));
    img.src = url;
  });
}

/** The queue entry on display, or null when there is nothing to review. */
function item() {
  return state.index >= 0 && state.index < state.items.length ? state.items[state.index] : null;
}

/**
 * Fetch classes and the review queue, then show the first undecided
 * prediction. `anchor` (a crop path) keeps the displayed prediction put when
 * the queue is re-synced from disk.
 */
async function loadList(anchor = null) {
  const [cls, listing] = await Promise.all([
    fetchJSON("/api/classes"),
    fetchJSON("/api/list"),
  ]);
  state.classes = cls.classes;
  state.items = listing.predictions;
  state.skipped = listing.total - listing.remaining;
  const i = anchor ? state.items.findIndex((e) => e.path === anchor) : -1;
  state.index = i >= 0 ? i : Math.min(state.index, state.items.length - 1);
  if (state.index < 0) state.index = 0;
  await loadCurrent();
}

/** Load the image and prediction of the current item; false when loading fails. */
async function loadCurrent() {
  const e = item();
  const seq = ++state.loadSeq;
  state.loading = true;
  state.boxes = [];
  state.img = null;
  if (!e) {
    state.loading = false;
    renderChrome();
    render();
    setStatus(
      state.reviewed
        ? "all reviewed — nothing left"
        : "nothing to review — run `just bootstrap <model>` first",
    );
    return true;
  }
  let ok = true;
  try {
    const [pred, img] = await Promise.all([
      // a malformed file is already described by e.error; don't refetch it
      e.error
        ? Promise.resolve({ boxes: [] })
        : fetchJSON("/api/prediction?path=" + encodeURIComponent(e.path)),
      loadImage("/api/image?path=" + encodeURIComponent(e.path)),
    ]);
    if (seq !== state.loadSeq) return false; // superseded by a newer load
    state.img = img;
    state.boxes = pred.boxes;
    setStatus("");
  } catch (err) {
    if (seq !== state.loadSeq) return false; // superseded by a newer load
    setStatus("load failed: " + err.message, "error");
    ok = false;
  }
  state.loading = false;
  renderChrome();
  render();
  return ok;
}

/** Send an accept/reject decision for the current prediction and advance. */
async function decide(accept) {
  const e = item();
  if (!e || state.busy || state.loading) return;
  state.busy = true;
  renderChrome();
  try {
    const res = await fetchJSON("/api/decision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: e.path, accept }),
    });
    state.items.splice(state.index, 1);
    state.reviewed++;
    if (state.index >= state.items.length) state.index = Math.max(0, state.items.length - 1);
    let msg;
    if (!accept) {
      msg = "rejected: prediction discarded";
    } else if (res.already_annotated) {
      msg = "crop already annotated — stale prediction dropped";
    } else if (res.saved > 0) {
      msg = `accepted: ${res.saved} box${res.saved === 1 ? "" : "es"} saved to labels/ ✓`;
    } else {
      msg = "accepted: marked empty/ignored ✓";
    }
    state.busy = false;
    if (await loadCurrent()) setStatus(msg, "ok");
  } catch (err) {
    state.busy = false;
    // the queue mirrors the files on disk, so re-syncing reconciles items
    // that were decided elsewhere or disappeared underneath us
    let msg = "decision failed: " + err.message;
    try {
      await loadList(e.path);
    } catch (err2) {
      msg += " (queue reload failed: " + err2.message + ")";
    }
    setStatus(msg, "error");
  }
}

/** Move to the next/previous queued prediction without deciding. */
async function step(delta) {
  if (state.busy) return;
  const j = state.index + delta;
  if (j < 0 || j >= state.items.length) {
    setStatus(delta > 0 ? "last prediction" : "first prediction");
    return;
  }
  state.index = j;
  await loadCurrent();
}

// ---------------------------------------------------------------- rendering

/**
 * Integer magnification that fits the crop into the canvas area, so pixels
 * stay crisp; falls back to fractional scaling only for crops that would
 * overflow at 1:1.
 */
function fitScale(img) {
  const wrap = $("canvas-wrap");
  const cs = getComputedStyle(wrap);
  const availW = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const fit = Math.min(availW / img.width, availH / img.height);
  return fit >= 1 ? Math.floor(fit) : fit;
}

/** Draw the crop and its predicted boxes, each tagged with class and confidence. */
function render() {
  const cv = $("cv");
  const ctx = cv.getContext("2d");
  const img = state.img;
  if (!img) {
    cv.width = 0;
    cv.height = 0;
    return;
  }
  const z = fitScale(img);
  const W = img.width * z, H = img.height * z;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width = W + "px";
  cv.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(img, 0, 0, W, H);

  state.boxes.forEach((b) => {
    const color = classColor(b.cls);
    const x = (b.cx - b.w / 2) * img.width * z;
    const y = (b.cy - b.h / 2) * img.height * z;
    const w = b.w * img.width * z, h = b.h * img.height * z;
    ctx.fillStyle = classColor(b.cls, 0.12);
    ctx.fillRect(x, y, w, h);
    ctx.lineWidth = 2;
    ctx.strokeStyle = color;
    ctx.strokeRect(x, y, w, h);

    const name = `${state.classes[b.cls]} ${b.conf.toFixed(2)}`;
    ctx.font = "12px system-ui, sans-serif";
    const tw = ctx.measureText(name).width;
    const ty = y >= 16 ? y - 15 : y + h;
    ctx.fillStyle = "rgba(0,0,0,0.72)";
    ctx.fillRect(x, ty, tw + 8, 15);
    ctx.fillStyle = "#fff";
    ctx.fillText(name, x + 4, ty + 11.5);
  });

  // fixed-size badge in the crop's top-left corner for a predicted background
  const e = item();
  if (e && !e.error && state.boxes.length === 0) {
    const label = "PREDICTED EMPTY";
    ctx.font = "12px system-ui, sans-serif";
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = "rgba(0,0,0,0.72)";
    ctx.fillRect(6, 6, tw + 8, 15);
    ctx.fillStyle = "#fff";
    ctx.fillText(label, 10, 17.5);
  }
}

/** Update the status line with an optional style kind ("ok" or "error"). */
function setStatus(msg, kind = "") {
  const el = $("status");
  el.textContent = msg;
  el.className = kind;
}

/** Rebuild the side list of predicted boxes with class names and confidences. */
function renderBoxList() {
  const ul = $("boxlist");
  ul.innerHTML = "";
  state.boxes.forEach((b) => {
    const li = document.createElement("li");
    li.innerHTML =
      `<span class="swatch" style="background:${classColor(b.cls)}"></span>` +
      `<span>${state.classes[b.cls]}</span>` +
      `<small>conf ${b.conf.toFixed(4)}</small>`;
    ul.appendChild(li);
  });
  const e = item();
  const note = $("empty-note");
  if (!e) {
    note.textContent = "";
  } else if (e.error) {
    note.textContent =
      `malformed prediction: ${e.error} — accept is disabled; reject discards the file`;
  } else if (state.boxes.length === 0) {
    note.textContent = "predicted empty — accept marks this crop empty/ignored";
  } else {
    note.textContent = "";
  }
}

/** Refresh filename, progress, and button enablement around the canvas. */
function renderChrome() {
  const e = item();
  $("filename").textContent = e ? e.path : "—";
  $("progress").textContent =
    `reviewed ${state.reviewed} · remaining ${state.items.length}` +
    (state.skipped ? ` · ${state.skipped} stale ignored` : "");
  $("btn-accept").disabled = state.busy || state.loading || !e || !!e.error || !state.img;
  $("btn-reject").disabled = state.busy || state.loading || !e;
  $("btn-prev").disabled = state.busy || state.index <= 0;
  $("btn-next").disabled = state.busy || state.index >= state.items.length - 1;
  renderBoxList();
}

// ---------------------------------------------------------------- keys

/** Global shortcuts: accept, reject, and decision-free browsing. */
window.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
  if (e.ctrlKey || e.metaKey) return;

  switch (e.key) {
    case "y":
    case "Y":
      e.preventDefault();
      if (!e.repeat) decide(true); // held keys must not burn through the queue
      break;
    case "n":
    case "N":
      e.preventDefault();
      if (!e.repeat) decide(false);
      break;
    case "ArrowRight":
    case "d":
      e.preventDefault();
      step(1);
      break;
    case "ArrowLeft":
    case "a":
      e.preventDefault();
      step(-1);
      break;
  }
});

// ---------------------------------------------------------------- wiring

$("btn-accept").onclick = () => decide(true);
$("btn-reject").onclick = () => decide(false);
$("btn-prev").onclick = () => step(-1);
$("btn-next").onclick = () => step(1);
window.addEventListener("resize", render);

loadList().catch((err) => setStatus("startup failed: " + err.message, "error"));
</script>

</body>
</html>
